[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-erc"
version = "0.1.0"
description = "ERC/EMI rule engine and rules"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-geometry",
    "shapely>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_erc"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-geometry = { workspace = true }
