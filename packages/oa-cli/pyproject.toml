[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-cli"
version = "0.1.0"
description = "The `oa` command line"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-jobs",
    "oa-service",
    "typer>=0.12",
]

[project.optional-dependencies]
# `oa serve` starts the REST server; it is imported dynamically (cli and server are siblings).
serve = ["oa-server"]

[project.scripts]
oa = "oa_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_cli"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-jobs = { workspace = true }
oa-service = { workspace = true }
oa-server = { workspace = true }
