[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-testkit"
version = "0.1.0"
description = "Test kit: board builders, analytic references, golden-data helpers, inline harness"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-framework",
    "oa-results",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pytest>=8.0",
]

[project.entry-points.pytest11]
oa_testkit = "oa_testkit.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_testkit"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-framework = { workspace = true }
oa-results = { workspace = true }
