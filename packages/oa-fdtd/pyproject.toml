[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-fdtd"
version = "0.1.0"
description = "GPU FDTD engine (CUDA via CuPy) with a NumPy reference engine"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "oa-accel",
    "oa-mesh",
    "oa-model",
    "oa-physics",
]

[project.scripts]
oa-fdtd = "oa_fdtd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_fdtd"]

[tool.hatch.build.targets.wheel.force-include]
"src/oa_fdtd/kernels" = "oa_fdtd/kernels"

[tool.uv.sources]
oa-accel = { workspace = true }
oa-mesh = { workspace = true }
oa-model = { workspace = true }
oa-physics = { workspace = true }
