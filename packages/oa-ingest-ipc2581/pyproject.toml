[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-ingest-ipc2581"
version = "0.1.0"
description = "IPC-2581 reader"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "numpy>=1.26",
    "shapely>=2.0",
    "lxml>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_ingest_ipc2581"]

[tool.uv.sources]
oa-model = { workspace = true }

[project.entry-points."open_analysis.ingest"]
ipc2581 = "oa_ingest_ipc2581:Ipc2581Reader"
