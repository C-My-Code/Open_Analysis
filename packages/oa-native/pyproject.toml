[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "oa-native"
version = "0.1.0"
description = "Open_Analysis compiled core (Rust/PyO3): KiCad S-expression parser"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=1.26"]

[tool.maturin]
manifest-path = "../../crates/oa-native/Cargo.toml"
python-source = "src"
module-name = "oa_native._native"
features = ["extension-module"]

[dependency-groups]
dev = ["maturin>=1.7,<2"]

[tool.uv]
# The Rust sources live outside this package directory. Without these keys `uv sync` reuses a
# cached build after the crate changes, and the stale module silently lacks the newer kernels
# (WP-520).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../../crates/oa-native/Cargo.toml" },
    { file = "../../crates/oa-native/Cargo.lock" },
    { file = "../../crates/oa-native/src/**/*.rs" },
]
