[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-geometry"
version = "0.1.0"
description = "Derived board geometry, ReferenceMap, cross-sections, regions"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-physics",
    "numpy>=1.26",
    "shapely>=2.0",
    "networkx>=3.2",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_geometry"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-physics = { workspace = true }
