[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-accel"
version = "0.1.0"
description = "GPU acceleration core: device selection, memory budget, CuPy backend, CPU oracle"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
# Never a hard dependency of any other package (ADR-0009 section 1).
cuda12 = ["cupy-cuda12x>=13.0", "nvmath-python[cu12]>=0.5"]
cuda13 = ["cupy-cuda13x>=14.0", "nvmath-python[cu13]>=0.7"]
# AMD hosts ROCm wheels as `amd-cupy` on its own index; best-effort, untested on hardware.
rocm = ["amd-cupy"]

[project.scripts]
oa-accel-doctor = "oa_accel.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_accel"]
