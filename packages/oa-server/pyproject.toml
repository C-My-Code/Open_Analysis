[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-server"
version = "0.1.0"
description = "FastAPI + WebSocket server"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-jobs",
    "oa-service",
    "oa-geometry",
    "pyarrow>=15",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    # fastapi.testclient (used by the endpoint tests) needs httpx at runtime
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_server"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-jobs = { workspace = true }
oa-service = { workspace = true }
oa-geometry = { workspace = true }
