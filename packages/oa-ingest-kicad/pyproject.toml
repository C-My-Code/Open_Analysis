[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-ingest-kicad"
version = "0.1.0"
description = "KiCad .kicad_pcb reader"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "numpy>=1.26",
    "shapely>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_ingest_kicad"]

[tool.uv.sources]
oa-model = { workspace = true }
