[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-devguard"
version = "0.1.0"
description = "Development-only guard: caps memory of every Python process started from the dev environment"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/oa_devguard"]

[tool.hatch.build.targets.wheel.force-include]
"src/sitecustomize.py" = "sitecustomize.py"
