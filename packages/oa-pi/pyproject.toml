[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-pi"
version = "0.1.0"
description = "Power integrity: DC IR drop, AC PDN"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-physics",
    "oa-geometry",
    "oa-mesh",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-fem>=9.0",
    "shapely>=2.0",
    "pyamg>=5.0",
]

[project.entry-points."open_analysis.analyses"]
"pi.dc" = "oa_pi.dc.analysis:PiDcAnalysis"

[project.entry-points."open_analysis.services"]
pdn = "oa_pi.service:make_service"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_pi"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-physics = { workspace = true }
oa-geometry = { workspace = true }
oa-mesh = { workspace = true }
