[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-em-palace"
version = "0.1.0"
description = "Palace solver adapter"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-em",
    "oa-jobs",
    "oa-mesh",
    "oa-network",
    "oa-physics",
    "numpy>=1.26",
    "scikit-rf>=1.0",
]

[project.entry-points."open_analysis.em_adapters"]
palace = "oa_em_palace:PalaceAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_em_palace"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-em = { workspace = true }
oa-jobs = { workspace = true }
oa-mesh = { workspace = true }
oa-network = { workspace = true }
oa-physics = { workspace = true }
