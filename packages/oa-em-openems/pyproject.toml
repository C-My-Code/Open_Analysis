[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-em-openems"
version = "0.1.0"
description = "openEMS solver adapter"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-em",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_em_openems"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-em = { workspace = true }
