[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-si"
version = "0.1.0"
description = "Signal integrity channel analysis (reserved, M2)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-rf>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_si"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
