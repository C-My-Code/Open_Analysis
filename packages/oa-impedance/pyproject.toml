[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-impedance"
version = "0.1.0"
description = "Closed-form, BEM and FEM impedance"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-physics",
    "oa-geometry",
    "oa-mesh",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-fem>=9.0",
    "pyamg>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_impedance"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-physics = { workspace = true }
oa-geometry = { workspace = true }
oa-mesh = { workspace = true }
