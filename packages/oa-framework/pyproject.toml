[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-framework"
version = "0.1.0"
description = "Plugin protocols, registry, services, job and external-run types"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_framework"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
