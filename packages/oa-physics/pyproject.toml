[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-physics"
version = "0.1.0"
description = "Dk/Df(f), roughness, rho(T) and analytic via models"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oa_physics"]

[tool.uv.sources]
oa-model = { workspace = true }
