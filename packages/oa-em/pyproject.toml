[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-em"
version = "0.1.0"
description = "EMProblem flow: region to S-parameters"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "oa-model",
    "oa-results",
    "oa-framework",
    "oa-physics",
    "oa-geometry",
    "oa-mesh",
    "oa-network",
    "oa-jobs",
    "numpy>=1.26",
    "shapely>=2.0",
    "scikit-rf>=1.0",
]

[project.entry-points."open_analysis.analyses"]
"em.sparams" = "oa_em.analysis:EmSparams"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_em"]

[tool.uv.sources]
oa-model = { workspace = true }
oa-results = { workspace = true }
oa-framework = { workspace = true }
oa-physics = { workspace = true }
oa-geometry = { workspace = true }
oa-mesh = { workspace = true }
oa-network = { workspace = true }
oa-jobs = { workspace = true }
