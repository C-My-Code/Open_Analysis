#
# Example: run `oa erc` on a KiCad board in CI and publish the findings as SARIF.
# Copy to .github/workflows/erc.yml and set BOARD. See docs/user/erc-github-action.md.
name: erc

on:
  pull_request:
    paths: ["**.kicad_pcb", "oa-project.yaml", "oa/**", ".github/workflows/erc.yml"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # upload-sarif

env:
  BOARD: hardware/board.kicad_pcb  # path of your board, relative to the repository root
  OA_DEVICE: cpu

jobs:
  erc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Open_Analysis
        run: uv tool install open-analysis
      - name: Run ERC
        run: |
          set -eu
          dir="$(dirname "$BOARD")"
          # a committed project (oa-project.yaml with your materials and intent) wins;
          # otherwise the board file is analysed directly and nothing is written next to it
          target="$BOARD"
          if [ -f "$dir/oa-project.yaml" ]; then target="$dir"; fi
          # exit code 1 when an error-severity violation exists; SARIF is written either way
          oa erc --project "$target" --sarif "$GITHUB_WORKSPACE/erc.sarif" --fail-on error
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('erc.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: erc.sarif
          category: open-analysis-erc
      - name: Keep the SARIF
        if: always() && hashFiles('erc.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: erc-sarif
          path: erc.sarif
