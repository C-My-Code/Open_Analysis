heavy = true
devices = ["cpu"]

[sub.targets.cpu]
time_max_s = 5.0
time_per = "run"
mem_max_mb = 4096

[[sub]]
id = "n1e6"
title = "power_plane refined to 1e6 unknowns, end to end"
runner = "dc02_scale_1e6"
heavy = true
devices = ["cpu", "cuda"]

[sub.targets.cpu]
time_max_s = 15
time_per = "run"
mem_max_mb = 4096

[sub.targets.cuda]
time_max_s = 8
time_per = "run"
gpu_mem_max_mb = 4096

[[sub]]
