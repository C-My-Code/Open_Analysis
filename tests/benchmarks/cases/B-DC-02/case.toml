schema = "oa-bench-case/1"
id = "B-DC-02"
title = "DC IR scale"
group = "dc-ir"
spec = "docs/BENCHMARKS.md#b-dc-02-dc-ir-scale"
# BENCHMARKS.md section 2, copied verbatim
targets_text = "Accuracy: as B-DC-01. Runtime: 3e5: <= 5 s CPU; 1e6: <= 15 s / <= 8 s. Memory: 4 GB host, 4 GB GPU. Today: 3e5 in 10.5 s"

[reference]
class = "converged"
citation = "power_plane board refined to 3e5 / 1e6 unknowns; as B-DC-01"
data = ""

[[sub]]
