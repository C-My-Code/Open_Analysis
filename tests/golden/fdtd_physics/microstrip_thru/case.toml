source = "reference: oa_impedance 2-D FEM RLGC(f) (solve_fem, Djordjevic-Sarkar FR-4 4.3/0.02 at 1 GHz, 0.38 mm x 35 um strip on 0.2 mm, eddy-current R(f)) cascaded over 25 mm between 47.88 ohm terminations (BENCHMARKS.md B-EM-01, R1). Computed on the dev machine on 2026-10-29; the WP-510 references supersede it when they land."

