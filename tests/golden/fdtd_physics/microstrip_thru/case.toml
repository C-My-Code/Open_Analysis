source = "reference: oa_impedance 2-D FEM RLGC(f) (solve_fem, Djordjevic-Sarkar FR-4 4.3/0.02 at 1 GHz, 0.38 mm x 35 um strip on 0.2 mm, eddy-current R(f)) at 48 log-spaced frequencies 0.1-20 GHz, cascaded over 25 mm between 49.20 ohm terminations (the modal port impedance; packages/oa-fdtd/tests/verification/fdtd_verify_runner.py rlgc_reference + cascade_s; BENCHMARKS.md B-EM-01, R1). Regenerated on 2026-10-30 for the strip-edge rule (port Z 47.88 -> 49.20 ohm); the earlier values interpolated a sparser RLGC (1.2391 dB at 15 GHz against 1.1936 here at the old 47.88 ohm). The WP-510 references supersede it when they land."

[tolerance]
il_abs_db = 0.05
s11_max_db = -25.0  # target -29; the port-S region below 1 GHz reaches -26

[inputs]
problem = "oa_testkit.emproblems.microstrip_thru_problem(length=25e-3, f_max=20e9) with the lumped ports replaced by wave ports on xmin/xmax (packages/oa-fdtd/bench/thru.py)"
f_hz = [2e9, 5e9, 10e9, 15e9, 20e9]
z_ref_ohm = 49.20

[expected]
il_db = [0.2031, 0.4501, 0.8317, 1.1911, 1.5314]
