source = "IPC-2141 (1996) surface microstrip, legacy: Z0 = 87/sqrt(er + 1.41) * ln(5.98 h / (0.8 W + t)). Expected value is the formula evaluated independently of oa_impedance (plain math in tools/validation); h = 0.2 mm, t = 35 um, er = 4.3, W = 0.5 mm. The ROADMAP quotes 36.8 ohm. Legacy formula, valid only for 0.1 < W/h < 2 and er < 15: used as a published formula, not as a physical truth."

