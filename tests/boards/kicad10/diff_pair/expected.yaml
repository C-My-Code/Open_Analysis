    via_span: [L1, L3]
    via_pitch: 0.0012
    return_vias_per_pair: 4
    diff_target_ohm: 100.0
erc:
  - rule_id: DP-001
    nets: [DP_P, DP_N]
    layer: L1
    source_layer: F.Cu
    location_mm: [11.5, 15]
    tolerance_mm: 2.0
    generator: boardgen.features.diff_pair
    why: "pair uncoupled over the 3 mm breakout at the launch end"
  - rule_id: DP-002
    nets: [DP_P, DP_N]
    layer: L1
    source_layer: F.Cu
    location_mm: null
    tolerance_mm: 0.0
    generator: boardgen.features.diff_pair
    why: "intra-pair length mismatch 0.400 mm caused by the bump at x=25.0..26.0 mm"
    cause_location_mm: [25.5, 15.375]
  - rule_id: DP-003
    nets: [DP_P, DP_N]
    layer: L3
    source_layer: In2.Cu
    location_mm: [72.5, 15]
    tolerance_mm: 3.0
    generator: boardgen.features.diff_pair
    why: "gap steps 0.15 -> 0.30 mm for 5 mm on the stripline section"
must_not_report: [RP-001, RP-002, RP-003, RP-004, RP-007, ED-001, ED-002, RF-001, PD-001, VI-001]
negative_cases:
  - rule_id: RP-004
    nets: [DP_P]
    layer: L1
    location_mm: [50.0, 15]
    generator: boardgen.features.diff_pair
    why: "layer change has 4 GND return vias"
unspecified:
  - rule_id: DP-001
    nets: [DP_P, DP_N]
    why: "the ~1.4 mm fan-outs to the via pairs and the 1 mm stripline fan-outs are also briefly uncoupled; whether they exceed the rule threshold is config dependent"
