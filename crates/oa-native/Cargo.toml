[package]
name = "oa-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Open_Analysis compiled core: KiCad S-expression parser (ADR-0008)"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py311"] }
numpy = "0.25"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
